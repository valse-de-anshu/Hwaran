<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshu Reanimated Cinematic Intro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;900&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: transparent;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* 512x512 Strict Frame - Now made seamless */
        #stage-box {
            position: relative;
            width: 100%; height: 100%;
            background: transparent;
            perspective: 1200px;
            overflow: visible; /* Allow glow to bleed out if needed */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Scaler frame to maintain 512x512 design proportions */
        #scaler-frame {
            width: 512px; height: 512px;
            position: relative;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

        /* NEW Orbital Camera Sweep */
        #scene {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: orbital-sweep 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- TYPOGRAPHY --- */
        .txt {
            position: absolute;
            color: #fff;
            transform-style: preserve-3d;
            text-transform: uppercase;
        }

        /* HEY! */
        #txt-hey {
            left: 50px; top: 20%; 
            font-size: 26px; font-weight: 300; letter-spacing: 0.4em;
            opacity: 0;
            transform: translateZ(80px) translateX(-50px);
            animation: pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.8s forwards;
        }

        /* HERE. */
        #txt-here {
            right: 40px; bottom: 25%; 
            font-size: 26px; font-weight: 900; letter-spacing: 0.6em;
            opacity: 0;
            transform: translateZ(120px) translateX(50px);
            animation: pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3.8s forwards;
        }

        /* ANSHU: Heavy Slam from the Heavens */
        #txt-anshu {
            top: 50%; left: 50%;
            margin-top: -80px; 
            font-size: 88px; font-weight: 900; 
            color: #ffffff; text-align: center; white-space: nowrap;
            text-shadow: 0 0 35px rgba(255,255,255,0.6);
            z-index: 1; 
            opacity: 0;
            transform: translate(-50%, -300%) translateZ(-200px) scale(0.8);
            letter-spacing: -0.02em;
            animation: monolith-slam 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 5s forwards;
        }

        /* --- THE OBSIDIAN MASCOT & 3D RIG --- */
        #mascot-anchor {
            position: absolute;
            top: 50%; left: 50%;
            margin-top: -90px; margin-left: -90px;
            width: 180px; height: 180px;
            transform-style: preserve-3d;
            z-index: 10; 
            /* FIXED: Removed opacity fade-in to prevent 3D depth flattening bugs */
            will-change: transform;
        }

        /* SOLID ORB FIX: Reverting to a single layered div for max browser compatibility */
        #jelly-orb {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3a3a3a 0%, #0a0a0a 50%, #000 100%);
            box-shadow: 
                inset 15px 15px 30px rgba(255, 255, 255, 0.35),
                inset -20px -20px 45px rgba(0, 0, 0, 0.9),
                0 0 35px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            overflow: hidden;
            /* FIXED: Forces 2D flattening context to prevent 3D clipping bugs on inner children */
            transform: translateZ(0); 
        }

        /* Internal Smoke - Increased Brightness */
        .smoke {
            position: absolute;
            width: 160%; height: 160%;
            top: -30%; left: -30%;
            opacity: 0.7; 
            animation: swirl linear infinite;
        }
        .smoke-1 { background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.6) 0%, transparent 40%); border-radius: 40% 60% 70% 30%; animation-duration: 15s; }
        .smoke-2 { background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.4) 0%, transparent 50%); border-radius: 60% 40% 30% 70%; animation-duration: 20s; animation-direction: reverse; }

        /* Mascot Face Rig */
        #head-turn-rig {
            position: absolute;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            z-index: 20;
        }

        #face-mover {
            position: absolute;
            top: 50%; left: 50%;
            width: 110px; height: 60px;
            transform: translate(-50%, -50%) translateZ(110px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform-style: preserve-3d;
        }

        .eyes-row {
            display: flex; justify-content: space-between; align-items: center; width: 65px; height: 40px;
            transform: scale(1.6);
        }

        .eye {
            position: relative;
            width: 15px; height: 35px; 
            background: #ffffff; 
            border-radius: 20px;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* Heart Eyes */
        @keyframes heart-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .eye::after {
            content: "♥"; position: absolute;
            font-size: 26px; 
            color: #ff0a33; 
            text-shadow: 0 0 20px #ff0a33, 0 0 40px #ff0a33;
            opacity: 0; transform: scale(0.5);
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .eye.heart-mode { background: transparent !important; box-shadow: none !important; }
        .eye.heart-mode::after { opacity: 1; animation: heart-pulse 0.8s infinite ease-in-out; }
        .eye.blink { transform: scaleY(0) !important; transition: transform 0.1s; }

        /* Anime Blush */
        .blush-row {
            display: flex; justify-content: space-between; width: 105px; margin-top: 2px;
            opacity: 0; transform: scale(0.8) translateZ(1px); transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .blush-row.active { opacity: 0.9; transform: scale(1) translateZ(1px); }
        .blush-spot {
            position: relative; width: 44px; height: 20px;
            background: radial-gradient(ellipse at center, rgba(255, 40, 90, 0.8) 0%, transparent 75%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }

        /* Impact Floor Shadow */
        #shadow {
            position: absolute;
            bottom: -30px; left: 50%;
            width: 140px; height: 20px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.3) 0%, transparent 70%);
            transform: translateX(-50%) rotateX(90deg);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease-out, transform 0.1s, width 0.1s;
        }

        /* --- ANIMATIONS --- */
        @keyframes orbital-sweep {
            0% { transform: translateZ(-800px) rotateY(-120deg) rotateX(30deg); filter: blur(20px); }
            50% { transform: translateZ(-100px) rotateY(20deg) rotateX(-10deg); filter: blur(0px); }
            100% { transform: translateZ(0) rotateY(0) rotateX(0); filter: blur(0px); }
        }

        @keyframes pop-in {
            0% { opacity: 0; transform: translateZ(100px) translateX(calc(var(--dir, -1) * 40px)) scale(0.8); filter: blur(10px); }
            100% { opacity: 1; transform: translateZ(100px) translateX(0) scale(1); filter: blur(0px); }
        }

        @keyframes monolith-slam {
            0% { opacity: 0; transform: translate(-50%, -300%) translateZ(-200px) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) translateZ(-100px) scale(1); }
        }

        @keyframes swirl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="stage-box">
        <div id="scaler-frame">
            <div id="scene">
                
                <div class="txt" id="txt-hey" style="--dir: -1;">HEY!</div>
                
                <!-- Burst Background Name -->
                <div class="txt" id="txt-anshu">ANSHU</div>

                <!-- Mascot Guard -->
                <div id="mascot-anchor">
                    <div id="shadow"></div>
                    <div id="jelly-rig" style="width:100%; height:100%; transform-style: preserve-3d;">
                        
                        <div id="jelly-orb">
                            <div class="smoke smoke-1"></div>
                            <div class="smoke smoke-2"></div>
                        </div>

                        <!-- 3D Orbiting Head Rig -->
                        <div id="head-turn-rig">
                            <div id="face-mover">
                                <div class="eyes-row">
                                    <div class="eye" id="eye-l"></div>
                                    <div class="eye" id="eye-r"></div>
                                </div>
                                <div class="blush-row" id="blush-container">
                                    <div class="blush-spot"></div>
                                    <div class="blush-spot"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Side Anchoring Text -->
                <div class="txt" id="txt-here" style="--dir: 1;">HERE.</div>

            </div>
        </div>
    </div>

    <script>
        const mascotAnchor = document.getElementById('mascot-anchor');
        const jellyRig = document.getElementById('jelly-rig');
        const headTurnRig = document.getElementById('head-turn-rig');
        const faceMover = document.getElementById('face-mover');
        const eyeL = document.getElementById('eye-l');
        const eyeR = document.getElementById('eye-r');
        const blush = document.getElementById('blush-container');
        const shadow = document.getElementById('shadow');
        const scene = document.getElementById('scene');
        const stageBox = document.getElementById('stage-box');
        const scalerFrame = document.getElementById('scaler-frame');

        // Physics State
        let time = 0;
        let isVisible = false;
        let animationStarted = false;

        // Auto Scaling Logic
        function handleResize() {
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            // Reference design size is 512x512
            const scale = Math.min(containerWidth / 512, containerHeight / 512);
            scalerFrame.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', handleResize);
        handleResize();
        
        let tHeadRotY = 0, cHeadRotY = 0; 
        let tHeadTiltX = 0, cHeadTiltX = 0;
        
        let tX = 0, cX = 0; 
        let tY = 0, cY = 0; 
        
        // Materialize Logic: Start scale at 0, position at floor level
        let tSx = 0, cSx = 0; 
        let tSy = 0, cSy = 0; 
        let tBaseY = 120, cBaseY = 120; 
        let tBaseX = 0, cBaseX = 0; 
        
        let tEyeH = 35, cEyeH = 35; 
        let tEyeW = 15, cEyeW = 15;

        let pX = 0, pY = 0, cpX = 0, cpY = 0;
        let interactive = false;
        let isSwooning = false; 
        let isHappyBouncing = false;

        // Spring stiffness controls for snappy or smooth movement
        let snapPhysics = false; 

        // --- ANIMATION CONTROL ---
        // Expose function to be called from Android/Compose when user reaches the absolute bottom
        window.startAuthorAnimation = function() {
            if (!animationStarted) {
                scalerFrame.style.opacity = '1';
                isVisible = true; // Force visible for the loop
                startChoreography();
                animate();
                animationStarted = true;
            }
        };

        // --- ENTIRELY NEW CHOREOGRAPHY ---
        function startChoreography() {
            // 0. The Materialize/Swell Effect (0.5s)
            setTimeout(() => { 
                snapPhysics = true; 
                shadow.style.opacity = '0.5';
                tSx = 1.3; tSy = 0.7; // Swell up wide from scale 0
            }, 500);

            // 1. The Bounce Recovery (0.8s)
            setTimeout(() => { 
                tSx = 0.85; tSy = 1.15; // Bounce tall
            }, 800);

            // 2. Settle (1.1s)
            setTimeout(() => { 
                snapPhysics = false; // Smooth physics
                tSx = 1; tSy = 1; 
            }, 1100);

            // Track "HEY!" exactly as it pops in (2.8s)
            setTimeout(() => { 
                tHeadRotY = -40; tHeadTiltX = -20; 
            }, 2800); 

            // Track "HERE." exactly as it pops in (3.8s)
            setTimeout(() => { 
                tHeadRotY = 40; tHeadTiltX = 10; 
            }, 3800);  

            // 3. ANSHU SLAMS DOWN! (The Shockwave at 5.0s)
            setTimeout(() => { 
                snapPhysics = true;
                tSx = 1.3; tSy = 0.7; // Jelly gets squished by the sheer force of the name drop
                tBaseY = 130;
                tHeadRotY = 0; tHeadTiltX = 0;
            }, 5000);

            // 4. Awe & Swoon at the Name (5.2s)
            setTimeout(() => { 
                snapPhysics = false;
                tSx = 0.95; tSy = 1.05; 
                tBaseY = 120;
                tHeadTiltX = 45; // Look straight up at ANSHU
                tEyeH = 45; tEyeW = 45; // Huge eyes
                blush.classList.add('active'); // Deep blush
            }, 5200);

            // 5. The "Wait, they are watching!" realization (6.5s)
            setTimeout(() => {
                blush.classList.remove('active');
                tHeadTiltX = -10; // Glare down at camera
                tEyeH = 8; tEyeW = 28; // Smug squint
                tSx = 1.2; tSy = 0.8; // Squash to jump
                tBaseY = 140;
            }, 6500);

            // 6. The Jealous Block! Leap up to hide the name! (6.8s)
            setTimeout(() => { 
                snapPhysics = true;
                tSx = 0.8; tSy = 1.25; 
                tBaseY = -60; // Perfect height to cover ANSHU
                tHeadTiltX = 0;
                shadow.style.opacity = '0.1'; // Shadow fades when jumping
                shadow.style.transform = 'translateX(-50%) rotateX(90deg) scale(0.5)';
            }, 6800);

            // 7. Land in Fierce Guard Mode (7.1s)
            setTimeout(() => {
                tSx = 1.3; tSy = 0.7; // Impact
                tEyeH = 12; tEyeW = 22; // Smug glare
                tX = -25; // Scan left
            }, 7100);

            setTimeout(() => {
                snapPhysics = false;
                tSx = 1.05; tSy = 0.95; 
                tX = 25; // Scan right
            }, 7400);
            
            setTimeout(() => { 
                tX = 0; 
                interactive = true; // Unlock mouse parallax
            }, 7900); 

            // --- NEW IDLE BEHAVIORS LOOP (8.5s+) ---
            setTimeout(() => {
                setInterval(() => {
                    if (!isVisible) return; // Only process if visible
                    
                    eyeL.classList.remove('heart-mode'); eyeR.classList.remove('heart-mode');
                    blush.classList.remove('active');
                    isSwooning = false; 
                    isHappyBouncing = false;

                    let rand = Math.random();

                    if (rand < 0.25) {
                        // PEEKABOO
                        snapPhysics = true;
                        tBaseY = 40; 
                        tHeadTiltX = 40; 
                        tEyeH = 40; tEyeW = 40; 
                        blush.classList.add('active');
                        
                        setTimeout(() => {
                            tBaseY = -60;
                            tHeadTiltX = 0;
                            tEyeH = 12; tEyeW = 22; 
                            blush.classList.remove('active');
                        }, 1800);

                    } else if (rand < 0.5) {
                        // HAPPY BOUNCES
                        snapPhysics = false;
                        isHappyBouncing = true;
                        tEyeH = 6; tEyeW = 28; 
                        blush.classList.add('active');
                        
                    } else if (rand < 0.75) {
                        // SWOON & HEARTS
                        snapPhysics = false;
                        isSwooning = true;
                        tEyeH = 35; tEyeW = 35;
                        tHeadTiltX = -10;
                        eyeL.classList.add('heart-mode'); eyeR.classList.add('heart-mode');
                        blush.classList.add('active');
                        
                    } else {
                        // SMUG GUARDING
                        snapPhysics = false;
                        tEyeH = 10; tEyeW = 22;
                        tSx = 1.15; tSy = 0.85;
                        tHeadRotY = (Math.random() - 0.5) * 60; 
                        
                        if(Math.random() > 0.4) {
                            eyeL.classList.add('blink'); eyeR.classList.add('blink');
                            setTimeout(() => { eyeL.classList.remove('blink'); eyeR.classList.remove('blink'); }, 120);
                        }
                    }
                }, 3500);
            }, 8500);
        }

        // --- MOUSE PARALLAX ---
        stageBox.addEventListener('mousemove', (e) => {
            if(!interactive) return;
            const rect = stageBox.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
            pX = x * 15; pY = -(y * 15);
        });
        stageBox.addEventListener('mouseleave', () => { pX = 0; pY = 0; });

        // --- ADVANCED RENDER LOOP ---
        let hopY = 0; 

        function animate() {
            if (!isVisible) {
                requestAnimationFrame(animate);
                return; 
            }

            time += 0.05;

            let breatheX = tSx;
            let breatheY = tSy;
            hopY = 0;
            
            // Emotion States Processing
            if (isHappyBouncing) {
                breatheX += Math.sin(time * 12) * 0.05;
                breatheY -= Math.sin(time * 12) * 0.05;
                hopY = -Math.abs(Math.sin(time * 10) * 15); 
                tBaseX = 0;
            } else if (isSwooning) {
                breatheX += Math.sin(time * 4) * 0.03;
                breatheY -= Math.sin(time * 4) * 0.03;
                tBaseX = Math.sin(time * 2.5) * 18; 
            } else if (tEyeH <= 16) { 
                breatheX += Math.sin(time * 5) * 0.01;
                breatheY -= Math.sin(time * 5) * 0.01;
                tBaseX = 0;
            } else {
                breatheX += Math.sin(time * 2) * 0.015;
                breatheY -= Math.sin(time * 2) * 0.015;
                tBaseX = 0;
            }

            // Dual Spring Rates (Snap vs Smooth)
            const speed = snapPhysics ? 0.35 : 0.12;

            cSx += (breatheX - cSx) * speed;
            cSy += (breatheY - cSy) * speed;
            cBaseX += (tBaseX - cBaseX) * speed;
            cBaseY += (tBaseY - cBaseY) * speed;
            
            cX += (tX - cX) * speed;
            cY += (tY - cY) * speed;
            
            cHeadRotY += (tHeadRotY - cHeadRotY) * speed;
            cHeadTiltX += (tHeadTiltX - cHeadTiltX) * speed;
            
            cEyeH += (tEyeH - cEyeH) * 0.25;
            cEyeW += (tEyeW - cEyeW) * 0.25;
            
            cpX += (pX - cpX) * 0.1;
            cpY += (pY - cpY) * 0.1;

            // Apply transforms 
            mascotAnchor.style.transform = `translateZ(50px) translateY(${cBaseY + hopY}px) translateX(${cBaseX}px)`;
            jellyRig.style.transform = `scale(${cSx}, ${cSy})`;
            
            headTurnRig.style.transform = `rotateY(${cHeadRotY}deg) rotateX(${cHeadTiltX}deg)`;
            faceMover.style.transform = `translate(-50%, -50%) translateZ(110px) translate(${cX}px, ${cY}px)`;
            
            eyeL.style.height = `${cEyeH.toFixed(2)}px`; eyeR.style.height = `${cEyeH.toFixed(2)}px`;
            eyeL.style.width = `${cEyeW.toFixed(2)}px`;  eyeR.style.width = `${cEyeW.toFixed(2)}px`;

            if(interactive) scene.style.transform = `rotateX(${cpY}deg) rotateY(${cpX}deg)`;

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
