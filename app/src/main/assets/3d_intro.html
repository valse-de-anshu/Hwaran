<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Kinetic Intro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap');

        :root {
            --accent-glow: rgba(255, 255, 255, 0.05);
            --text-silver: linear-gradient(180deg, #ffffff 0%, #b0b0b0 100%);
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            color: #fff;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Inter', sans-serif;
        }

        /* High-Perspective 3D Stage */
        #viewport {
            perspective: 2000px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            transform: scale(0.75);
        }

        /* Master Camera Rig */
        #camera-rig {
            position: relative;
            transform-style: preserve-3d;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: hyper-cinema-sweep 6s cubic-bezier(0.2, 1, 0.2, 1) forwards;
        }

        /* --- THE DISTRIBUTED TYPOGRAPHY --- */
        .word-3d {
            position: absolute;
            transform-style: preserve-3d;
            pointer-events: none;
            opacity: 0;
            filter: blur(10px); 
        }

        /* Word: MY */
        #word-1 {
            transform: translate3d(-150px, -200px, 800px) rotateY(-45deg);
            animation: word-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1.5em;
            color: #ffffff; /* Forced pure white to fix dimming */
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Word: PURE */
        #word-2 {
            transform: translate3d(180px, -50px, 400px) rotateY(30deg);
            animation: word-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) 2.5s forwards;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 1.2em;
            color: #ffffff; /* Forced pure white to fix dimming */
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* Word: LIBRARY */
        #word-3 {
            transform: translate3d(0, 120px, 0);
            opacity: 0;
            animation: library-reveal 2.5s cubic-bezier(0.16, 1, 0.3, 1) 3.5s forwards;
        }

        .main-text {
            font-size: 72px; 
            font-weight: 900;
            letter-spacing: -0.04em;
            background: var(--text-silver);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            /* REMOVED buggy filter: drop-shadow() that caused the ugly grey box */
        }

        /* Shimmer Flash Effect */
        .main-text::after {
            content: "LIBRARY.";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.95) 50%, transparent 60%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer-sweep 5s ease-in-out infinite;
        }

        /* --- THE JELLYBALL MASCOT --- */
        .ball-anchor {
            position: absolute;
            transform-style: preserve-3d;
            transform: translateZ(150px);
        }

        #jelly-orb {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            /* Pure high-contrast black glass gradient - No backdrop-filter needed */
            background: radial-gradient(circle at 35% 35%, 
                #2a2a2a 0%, 
                #0a0a0a 50%, 
                #000000 100%);
            box-shadow: 
                inset 15px 15px 30px rgba(255, 255, 255, 0.15),
                inset -20px -20px 50px rgba(0, 0, 0, 1),
                0 0 30px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            will-change: transform;
        }

        /* High contrast swirling smoke layers - Fixed rendering mode */
        .smoke-core {
            position: absolute;
            width: 180%; height: 180%;
            top: -40%; left: -40%;
            /* Removed buggy mix-blend-mode */
            opacity: 0.25; /* Standard opacity for reliable rendering */
            filter: blur(8px); /* Sharper blur to look like the reference image */
            animation: swirl linear infinite;
        }

        /* Sharper, clearer inner swirls */
        .smoke-1 { background: radial-gradient(circle at 50% 50%, #fff 0%, transparent 40%); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation-duration: 20s; transform-origin: 45% 55%; }
        .smoke-2 { background: radial-gradient(circle at 40% 40%, #fff 0%, transparent 50%); border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; animation-duration: 25s; animation-direction: reverse; transform-origin: 55% 45%; }
        .smoke-3 { background: radial-gradient(circle at 60% 60%, #fff 0%, transparent 35%); border-radius: 30% 70% 50% 50% / 50% 40% 60% 50%; animation-duration: 18s; transform-origin: 50% 50%; }

        #shadow {
            position: absolute;
            bottom: -50px;
            left: 50%;
            width: 200px;
            height: 25px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.2) 0%, transparent 75%);
            transform: translateX(-50%) rotateX(90deg);
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0;
            animation: fade-in 2s ease-out 3s forwards;
        }

        #eye-mover {
            position: absolute;
            top: 50%; left: 50%;
            width: 90px; height: 45px;
            /* Added translateZ(5px) so the eyes always render ON TOP of the black orb in 3D space */
            transform: translate(-50%, -50%) translateZ(5px);
            display: flex;
            justify-content: space-between;
            z-index: 100; /* Forced to top */
            opacity: 0;
            animation: fade-in 1s ease-out 4.5s forwards;
        }

        .eye {
            width: 18px;
            height: 42px;
            background: #ffffff; /* Pure white */
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.9); /* Cleaner glow */
        }

        .eye.blink { transform: scaleY(0); transition: transform 0.1s; }

        /* --- HYPER-COMPLEX CAMERA KEYFRAMES --- */
        @keyframes hyper-cinema-sweep {
            0% {
                transform: translateZ(-1800px) translateY(500px) translateX(-400px) rotateX(70deg) rotateY(-80deg) rotateZ(30deg);
                filter: blur(15px); 
                opacity: 0;
            }
            15% { opacity: 1; }
            45% {
                transform: translateZ(-300px) translateY(100px) translateX(200px) rotateX(20deg) rotateY(15deg) rotateZ(-5deg);
            }
            75% {
                transform: translateZ(100px) translateY(-50px) translateX(-50px) rotateX(-5deg) rotateY(-5deg) rotateZ(2deg);
            }
            100% {
                transform: translateZ(0) translateY(0) translateX(0) rotateX(0) rotateY(0) rotateZ(0);
                filter: blur(0px);
                opacity: 1;
            }
        }

        @keyframes word-reveal {
            to { opacity: 1; filter: blur(0px); }
        }

        @keyframes library-reveal {
            0% { opacity: 0; transform: translate3d(0, 120px, 400px) scale(0.8); filter: blur(15px); }
            100% { opacity: 1; transform: translate3d(0, 120px, 0) scale(1); filter: blur(0px); }
        }

        @keyframes shimmer-sweep {
            0% { background-position: -200% 0; }
            40% { background-position: 200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes fade-in { to { opacity: 1; } }
        @keyframes swirl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="viewport">
        <div id="camera-rig">
            
            <!-- Floating Word 1: MY -->
            <div class="word-3d" id="word-1">MY</div>

            <!-- Floating Word 2: PURE -->
            <div class="word-3d" id="word-2">PURE</div>

            <!-- Jelly Ball Mascot Anchor -->
            <div class="ball-anchor">
                <div id="shadow"></div>
                <div id="jelly-orb">
                    <div class="smoke-core smoke-1"></div>
                    <div class="smoke-core smoke-2"></div>
                    <div class="smoke-core smoke-3"></div>
                </div>
                <div id="eye-mover">
                    <div class="eye" id="eye-l"></div>
                    <div class="eye" id="eye-r"></div>
                </div>
            </div>

            <!-- Floating Word 3: LIBRARY -->
            <div class="word-3d" id="word-3">
                <div class="main-text">LIBRARY.</div>
            </div>

        </div>
    </div>

    <script>
        const orb = document.getElementById('jelly-orb');
        const eyeMover = document.getElementById('eye-mover');
        const eyeL = document.getElementById('eye-l');
        const eyeR = document.getElementById('eye-r');

        let time = 0;
        let tarX = 0, tarY = 0, curX = 0, curY = 0;
        let isReady = false;

        // Start interactions after the 6s cinematic sequence
        setTimeout(() => { 
            isReady = true;
            // First look at the "LIBRARY" word below
            tarX = 0; tarY = 25;
            setTimeout(() => {
                // Then look at us
                tarX = 0; tarY = 0;
                setTimeout(() => {
                    triggerThinking();
                }, 1500);
            }, 1200);
        }, 6000);

        function triggerThinking() {
            if(!isReady) return;
            const shy = Math.random() > 0.4;
            if (shy) {
                eyeL.classList.add('blink'); eyeR.classList.add('blink');
                setTimeout(() => { eyeL.classList.remove('blink'); eyeR.classList.remove('blink'); }, 120);
                tarX = (Math.random() - 0.5) * 35;
                tarY = 18;
            } else {
                tarX = 0; tarY = 0;
            }
            setTimeout(triggerThinking, 3000 + Math.random() * 3000);
        }

        function loop() {
            time += 0.04;

            // Continuous Jelly Jiggle
            const sX = 1 + Math.sin(time * 2.4) * 0.015;
            const sY = 1 - Math.sin(time * 2.4) * 0.015;
            orb.style.transform = `scale(${sX}, ${sY})`;

            // Soft Eye Spring Physics
            curX += (tarX - curX) * 0.05;
            curY += (tarY - curY) * 0.05;
            // Preserving the translateZ(5px) dynamically so the eyes stay bright
            eyeMover.style.transform = `translate(calc(-50% + ${curX}px), calc(-50% + ${curY}px)) translateZ(5px)`;

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
