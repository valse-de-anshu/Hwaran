<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JellyBall Music Player - Heavy Rock Conductor</title>
    <style>
        :root { --bg-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent !important; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, sans-serif; user-select: none; }
        .stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: transparent !important; }
        #shadow { position: absolute; bottom: 25%; width: 80px; height: 12px; background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 75%); border-radius: 50%; z-index: 1; transform-origin: center center; will-change: transform, opacity; }
        #body-wrapper { position: relative; width: 100px; height: 100px; transform-origin: center bottom; z-index: 5; display: flex; justify-content: center; will-change: transform; }
        .orb { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(200, 30, 50, 0.65) 0%, rgba(80, 10, 20, 0.85) 50%, rgba(20, 2, 5, 0.98) 100%); box-shadow: inset 4px 4px 12px rgba(255, 120, 140, 0.4), inset -6px -6px 15px rgba(0, 0, 0, 0.8); overflow: hidden; border: 1.5px solid rgba(255,50,80,0.4); transition: all 0.8s ease; will-change: transform, box-shadow, border; }
        .internal-smoke { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; opacity: 0.5; background: radial-gradient(circle at center, rgba(255,80,100,0.3) 0%, transparent 70%); animation: swirl 10s linear infinite; pointer-events: none; }
        @keyframes swirl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #face-mover { position: absolute; top: 50%; left: 50%; width: 70px; height: 50px; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; will-change: transform; }
        .eyes-row { display: flex; justify-content: space-between; width: 35px; z-index: 2; transform-origin: center center; }

        .eye {
            position: relative; width: 8px; height: 14px; background: #ffffff; border-radius: 4px 8px 3px 3px; box-shadow: 0 0 12px #ff2244, inset 0 0 4px #ff0000; transform-origin: center center; will-change: width, height, transform, border-radius;
            transition: height 0.3s ease, width 0.3s ease, transform 0.3s ease;
        }
        .eye.blink { transform: scaleY(0) !important; transition: transform 0.08s !important; }

        #eye-l { transform: translateY(-2px) rotate(18deg); }
        #eye-r { transform: translateY(-2px) rotate(-18deg); }

        .face-state-headbang #eye-l { height: 16px; width: 9px; transform: translateY(-1px) rotate(22deg); box-shadow: 0 0 16px #ff0000; }
        .face-state-headbang #eye-r { height: 16px; width: 9px; transform: translateY(-1px) rotate(-22deg); box-shadow: 0 0 16px #ff0000; }

        .face-state-riff #eye-l { height: 12px; width: 10px; border-radius: 3px; transform: translateY(0px) rotate(15deg); }
        .face-state-riff #eye-r { height: 12px; width: 10px; border-radius: 3px; transform: translateY(0px) rotate(-15deg); }

        .face-state-shred #eye-l { height: 6px; width: 14px; border-radius: 2px; transform: translateY(-4px) rotate(25deg); box-shadow: 0 0 18px #ff2255; }
        .face-state-shred #eye-r { height: 6px; width: 14px; border-radius: 2px; transform: translateY(-4px) rotate(-25deg); box-shadow: 0 0 18px #ff2255; }

        .face-state-jump #eye-l { height: 16px; width: 12px; border-radius: 50%; transform: translateY(-2px); box-shadow: 0 0 20px #ffffff; }
        .face-state-jump #eye-r { height: 16px; width: 12px; border-radius: 50%; transform: translateY(-2px); box-shadow: 0 0 20px #ffffff; }

        .eye.sleep { height: 3px; width: 12px; background: #aa4444; box-shadow: none; border-radius: 4px; transform: translateY(5px) rotate(-5deg); opacity: 0.7; }
        #eye-r.sleep { transform: translateY(5px) rotate(5deg); }

        .hands-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; will-change: transform; }
        .hand { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,200,200,0.5) 0%, rgba(120,20,30,0.8) 70%); box-shadow: inset 2px 2px 5px rgba(255,255,255,0.4), 0 0 10px rgba(255,0,50,0.4); border: 1px solid rgba(255,100,120,0.4); transform: translate(-50%, -50%) scale(0); opacity: 0; transition: opacity 0.5s ease; will-change: transform; }
        .hand.visible { opacity: 1; }
        #baton { position: absolute; bottom: 11px; left: 11px; width: 3px; height: 58px; background: linear-gradient(to top, #330000 15%, #ff2244 50%, #ffffff 100%); border-radius: 2px; transform-origin: bottom center; box-shadow: 0 0 12px rgba(255,0,50,0.9); opacity: 0; transition: opacity 0.3s ease; will-change: transform; }
        .baton-glow { position: absolute; top: -5px; left: -2px; width: 7px; height: 7px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 12px 4px #ff2244, 0 0 22px #ffffff; }
    </style>
</head>
<body>
    <div class="stage">
        <div id="shadow"></div>
        <div id="body-wrapper" class="genre-rock">
            <div class="orb"><div class="internal-smoke"></div></div>
            <div id="face-mover">
                <div class="eyes-row">
                    <div class="eye sleep" id="eye-l"></div>
                    <div class="eye sleep" id="eye-r"></div>
                </div>
            </div>
        </div>
        <div class="hands-container">
            <div class="hand" id="hand-l"></div>
            <div class="hand" id="hand-r"><div id="baton"><div class="baton-glow"></div></div></div>
        </div>
    </div>

    <script>
        const bodyWrapper = document.getElementById('body-wrapper');
        const shadow = document.getElementById('shadow');
        const face = document.getElementById('face-mover');
        const eyeL = document.getElementById('eye-l');
        const eyeR = document.getElementById('eye-r');
        const handL = document.getElementById('hand-l');
        const handR = document.getElementById('hand-r');
        const baton = document.getElementById('baton');

        const physics = {
            bodyY:   { current: 0,   target: 0,   vel: 0, spring: 0.16, friction: 0.62 },
            scaleX:  { current: 1,   target: 1,   vel: 0, spring: 0.18, friction: 0.58 },
            scaleY:  { current: 1,   target: 1,   vel: 0, spring: 0.18, friction: 0.58 },
            rotate:  { current: 0,   target: 0,   vel: 0, spring: 0.12, friction: 0.65 },
            faceX:   { current: 0,   target: 0,   vel: 0, spring: 0.15, friction: 0.65 },
            faceY:   { current: 0,   target: 0,   vel: 0, spring: 0.15, friction: 0.65 },
            handLX:  { current: -30, target: -30, vel: 0, spring: 0.18, friction: 0.60 },
            handLY:  { current: 25,  target: 25,  vel: 0, spring: 0.18, friction: 0.60 },
            handRX:  { current: 30,  target: 30,  vel: 0, spring: 0.18, friction: 0.60 },
            handRY:  { current: 25,  target: 25,  vel: 0, spring: 0.18, friction: 0.60 },
            batonRot:{ current: 0,   target: 0,   vel: 0, spring: 0.22, friction: 0.52 }
        };

        let appState = 'SLEEP';
        let globalTime = Math.random() * 1000;
        let lastFrameTime = performance.now();

        window.onload = () => { loop(); };

        window.setPlaybackState = function(isPlaying) {
            if (isPlaying && appState === 'SLEEP') transitionToWake();
            else if (!isPlaying && appState !== 'SLEEP') triggerSleep();
        };

        window.setGenre = function(genre) {};

        function triggerSleep() {
            appState = 'SLEEP';
            baton.style.opacity = 0;
            handL.classList.remove('visible');
            handR.classList.remove('visible');
            physics.bodyY.target = 10;
            physics.faceY.target = 12;
            physics.faceX.target = 0;
            physics.scaleX.target = 1;
            physics.scaleY.target = 1;
            physics.rotate.target = 0;
            physics.handLX.target = -30;
            physics.handLY.target = 25;
            physics.handRX.target = 30;
            physics.handRY.target = 25;
            physics.batonRot.target = 0;
        }

        function transitionToWake() {
            appState = 'CONDUCT';
            eyeL.classList.remove('sleep');
            eyeR.classList.remove('sleep');
            handL.classList.add('visible');
            handR.classList.add('visible');
            baton.style.opacity = 1;
        }

        let blinkTimer = 1.0 + Math.random() * 2.0;
        let isBlinking = false;
        function triggerBlink() {
            if (!isBlinking && appState === 'CONDUCT') {
                isBlinking = true;
                eyeL.classList.add('blink'); eyeR.classList.add('blink');
                setTimeout(() => { eyeL.classList.remove('blink'); eyeR.classList.remove('blink'); isBlinking = false; }, 90);
            }
        }

        // ══════════════════════════════════════════════════════════════
        // NEW DYNAMIC ROCK CONDUCTING MOVEMENT SET
        // ══════════════════════════════════════════════════════════════
        const sequences = [
            // 0: Heavy Metal Headbang (Power Downbeats)
            { dur: 5.5, update(t) {
                let beat = Math.sin(t * Math.PI * 4); // Fast 8th-note headbanging beat
                let isDown = beat > 0;
                physics.bodyY.target = isDown ? 22 : -12;
                physics.faceY.target = isDown ? 20 : -14;
                physics.scaleY.target = isDown ? 0.76 : 1.22;
                physics.scaleX.target = isDown ? 1.24 : 0.82;
                physics.rotate.target = Math.sin(t * Math.PI * 2) * 12;
                physics.handRX.target = 34 + Math.sin(t * 10) * 12;
                physics.handRY.target = isDown ? 22 : -20;
                physics.handLX.target = -34 - Math.sin(t * 10) * 12;
                physics.handLY.target = isDown ? 22 : -20;
                physics.batonRot.target = isDown ? 65 : -50;
                face.className = 'face-state-headbang';
            }},

            // 1: Electric Riff Strum & Slash
            { dur: 6.0, update(t) {
                let strum = Math.sin(t * Math.PI * 6); // Fast guitar strumming
                physics.bodyY.target = Math.abs(strum) * 10;
                physics.rotate.target = -14 + strum * 6;
                physics.handLX.target = -42; // Holding guitar neck
                physics.handLY.target = -16;
                physics.handRX.target = 22 + strum * 26; // Strumming across body
                physics.handRY.target = -5 + Math.abs(strum) * 15;
                physics.batonRot.target = -70 + strum * 80;
                physics.scaleX.target = 1.05;
                physics.scaleY.target = 0.95;
                physics.faceX.target = -6;
                physics.faceY.target = 4;
                face.className = 'face-state-riff';
            }},

            // 2: Stage Mosh Windmill
            { dur: 5.0, update(t) {
                let mosh = Math.sin(t * Math.PI * 2.5);
                physics.rotate.target = mosh * 28;
                physics.bodyY.target = -6 + Math.abs(mosh) * 16;
                physics.scaleX.target = 1 + mosh * 0.15;
                physics.scaleY.target = 1 - mosh * 0.15;
                physics.handRX.target = 36 + mosh * 22;
                physics.handRY.target = -15 - Math.abs(mosh) * 18;
                physics.handLX.target = -36 + mosh * 22;
                physics.handLY.target = 10 + Math.abs(mosh) * 18;
                physics.batonRot.target = mosh * 85;
                physics.faceX.target = mosh * 12;
                physics.faceY.target = Math.abs(mosh) * 8;
                face.className = 'face-state-headbang';
            }},

            // 3: Guitar Solo Shred & Power Stance
            { dur: 6.5, update(t) {
                let tremor = (Math.random() - 0.5) * 14;
                let solo = Math.sin(t * Math.PI * 8); // Rapid 16th-note vibration
                physics.bodyY.target = 16 + Math.abs(solo) * 6;
                physics.scaleX.target = 1.26;
                physics.scaleY.target = 0.78;
                physics.rotate.target = 8 + tremor * 0.5;
                physics.faceX.target = tremor * 0.5;
                physics.faceY.target = -16; // Head thrown back in solo ecstasy
                physics.handLX.target = -38 + solo * 6;
                physics.handLY.target = -22;
                physics.handRX.target = 28 + tremor;
                physics.handRY.target = -12 + solo * 10;
                physics.batonRot.target = 40 + solo * 45 + tremor;
                face.className = 'face-state-shred';
            }},

            // 4: Stage Jump & Crash Slam
            { dur: 5.2, update(t) {
                let phase = (t % 2.6) / 2.6;
                if (phase < 0.45) {
                    // Air Jump
                    physics.bodyY.target = -30;
                    physics.scaleY.target = 1.28;
                    physics.scaleX.target = 0.76;
                    physics.rotate.target = -10;
                    physics.faceY.target = -14;
                    physics.handRX.target = 42;
                    physics.handRY.target = -28;
                    physics.handLX.target = -42;
                    physics.handLY.target = -28;
                    physics.batonRot.target = 80;
                    face.className = 'face-state-jump';
                } else {
                    // Landing Slam
                    physics.bodyY.target = 24;
                    physics.scaleY.target = 0.68;
                    physics.scaleX.target = 1.32;
                    physics.rotate.target = 12;
                    physics.faceY.target = 18;
                    physics.handRX.target = 48;
                    physics.handRY.target = 24;
                    physics.handLX.target = -48;
                    physics.handLY.target = 24;
                    physics.batonRot.target = -60;
                    face.className = 'face-state-headbang';
                }
            }},

            // 5: Crowd Hype Double Slash
            { dur: 5.8, update(t) {
                let pump = Math.sin(t * Math.PI * 3);
                physics.bodyY.target = pump * 12;
                physics.rotate.target = Math.cos(t * Math.PI) * 10;
                physics.scaleX.target = 1 + pump * 0.08;
                physics.scaleY.target = 1 - pump * 0.08;
                physics.handLX.target = -32;
                physics.handLY.target = -25 + pump * 22;
                physics.handRX.target = 32;
                physics.handRY.target = -25 + pump * 22;
                physics.batonRot.target = pump * 60;
                physics.faceX.target = 0;
                physics.faceY.target = pump * 8;
                face.className = 'face-state-headbang';
            }}
        ];

        let seqIndex = 0;
        let seqTime = 0;
        let seqDuration = sequences[0].dur;

        function updateConduct(dt, tempo) {
            blinkTimer -= dt;
            if (blinkTimer <= 0) {
                triggerBlink();
                blinkTimer = 1.2 + Math.random() * 2.2;
            }
            seqTime += dt * 1.8; // High energy rock speed
            if (seqTime >= seqDuration) {
                seqIndex = (seqIndex + 1) % sequences.length;
                seqTime = 0;
                seqDuration = sequences[seqIndex].dur;
            }
            sequences[seqIndex].update(seqTime);
        }

        function applyPhysics() {
            for (let key in physics) {
                let p = physics[key];
                let force = (p.target - p.current) * p.spring;
                p.vel += force;
                p.vel *= p.friction;
                p.current += p.vel;
            }
            bodyWrapper.style.transform = `translateY(${physics.bodyY.current}px) scale(${physics.scaleX.current}, ${physics.scaleY.current}) rotate(${physics.rotate.current}deg)`;
            shadow.style.transform = `scale(${physics.scaleX.current - (physics.bodyY.current * 0.012)})`;
            shadow.style.opacity = 0.38 - (physics.bodyY.current * 0.006);
            face.style.transform = `translate(calc(-50% + ${physics.faceX.current}px), calc(-50% + ${physics.faceY.current}px))`;
            handL.style.transform = `translate(calc(-50% + 50vw + ${physics.handLX.current}px), calc(-50% + 50vh + ${physics.handLY.current}px))`;
            handR.style.transform = `translate(calc(-50% + 50vw + ${physics.handRX.current}px), calc(-50% + 50vh + ${physics.handRY.current}px))`;
            baton.style.transform = `rotate(${physics.batonRot.current}deg)`;
        }

        function loop() {
            let now = performance.now();
            let dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;
            globalTime += dt * 1.8;

            if (appState === 'CONDUCT') {
                updateConduct(dt, 1.8);
            } else {
                let breath = Math.sin(globalTime * 2.5);
                physics.scaleX.target = 1 + breath * 0.02;
                physics.scaleY.target = 1 - breath * 0.02;
                physics.faceY.target = 12;
            }
            applyPhysics();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
