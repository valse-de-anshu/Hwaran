<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JellyBall Music Player - Depressed Arc Conductor</title>
    <style>
        :root { --bg-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent !important; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, sans-serif; user-select: none; }
        .stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: transparent !important; }
        #shadow { position: absolute; bottom: 22%; width: 85px; height: 10px; background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 75%); border-radius: 50%; z-index: 1; transform-origin: center center; will-change: transform, opacity; }
        #body-wrapper { position: relative; width: 100px; height: 100px; transform-origin: center bottom; z-index: 5; display: flex; justify-content: center; will-change: transform; }
        .orb { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(35, 45, 75, 0.75) 0%, rgba(12, 16, 30, 0.90) 50%, rgba(2, 4, 10, 0.98) 100%); box-shadow: inset 3px 3px 10px rgba(120, 140, 190, 0.25), inset -6px -6px 18px rgba(0, 0, 0, 0.95); overflow: hidden; border: 1.5px solid rgba(120,140,190,0.25); transition: all 0.8s ease; will-change: transform, box-shadow, border; }
        .internal-smoke { position: absolute; width: 100%; height: 100%; top: 0; left: 0; border-radius: 50%; opacity: 0.35; background: radial-gradient(circle at center, rgba(90,110,160,0.3) 0%, transparent 75%); animation: swirl 24s linear infinite; pointer-events: none; }
        @keyframes swirl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #face-mover { position: absolute; top: 50%; left: 50%; width: 70px; height: 50px; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; will-change: transform; }
        .eyes-row { display: flex; justify-content: space-between; width: 35px; z-index: 2; transform-origin: center center; }

        .eye {
            position: relative; width: 13px; height: 6px; background: #99aab8; border-radius: 3px 3px 9px 9px; box-shadow: 0 0 10px rgba(153, 170, 184, 0.5); transform-origin: center center; will-change: width, height, transform, border-radius;
            transition: height 0.4s ease, width 0.4s ease, transform 0.4s ease, background-color 0.4s ease;
        }
        .eye.blink { transform: scaleY(0) !important; transition: transform 0.1s !important; }

        /* Depressed Arc Eye States */
        #eye-l { transform: translateY(6px) rotate(-14deg); }
        #eye-r { transform: translateY(6px) rotate(14deg); }

        .face-state-depressed-slump #eye-l { height: 5px; width: 13px; transform: translateY(8px) rotate(-18deg); opacity: 0.7; }
        .face-state-depressed-slump #eye-r { height: 5px; width: 13px; transform: translateY(8px) rotate(18deg); opacity: 0.7; }

        .face-state-depressed-shake #eye-l { height: 7px; width: 12px; transform: translateY(4px) rotate(-10deg); opacity: 0.9; }
        .face-state-depressed-shake #eye-r { height: 7px; width: 12px; transform: translateY(4px) rotate(10deg); opacity: 0.9; }

        .face-state-depressed-clutch #eye-l { height: 4px; width: 11px; transform: translateY(6px) rotate(-16deg); opacity: 0.6; }
        .face-state-depressed-clutch #eye-r { height: 4px; width: 11px; transform: translateY(6px) rotate(16deg); opacity: 0.6; }

        .face-state-depressed-outburst #eye-l { height: 10px; width: 11px; border-radius: 4px; transform: translateY(-2px) rotate(-12deg); opacity: 0.9; box-shadow: 0 0 12px #aaaaff; }
        .face-state-depressed-outburst #eye-r { height: 10px; width: 11px; border-radius: 4px; transform: translateY(-2px) rotate(12deg); opacity: 0.9; box-shadow: 0 0 12px #aaaaff; }

        .eye.sleep { height: 3px; width: 10px; background: #556677; box-shadow: none; border-radius: 5px; transform: translateY(8px) rotate(-5deg); opacity: 0.5; }
        #eye-r.sleep { transform: translateY(8px) rotate(5deg); }

        .mouth { position: relative; width: 8px; height: 2px; background: #778899; border-radius: 10px; margin-top: 4px; opacity: 0.6; }

        .hands-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; will-change: transform; }
        .hand { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(160,180,210,0.4) 0%, rgba(35,45,65,0.7) 70%); box-shadow: inset 1px 1px 3px rgba(255,255,255,0.2), 0 0 8px rgba(0,0,0,0.6); border: 1px solid rgba(120,140,190,0.25); transform: translate(-50%, -50%) scale(0); opacity: 0; transition: opacity 0.5s ease; will-change: transform; }
        .hand.visible { opacity: 0.9; }
        #baton { position: absolute; bottom: 11px; left: 11px; width: 2.5px; height: 55px; background: linear-gradient(to top, #111 20%, #7788aa 50%, #ccd 100%); border-radius: 2px; transform-origin: bottom center; box-shadow: 0 0 8px rgba(120,140,190,0.6); opacity: 0; transition: opacity 0.3s ease; will-change: transform; }
        .baton-glow { position: absolute; top: -3px; left: -1px; width: 4.5px; height: 4.5px; background: #99aabb; border-radius: 50%; box-shadow: 0 0 10px 3px rgba(120, 140, 190, 0.7); }
    </style>
</head>
<body>
    <div class="stage">
        <div id="shadow"></div>
        <div id="body-wrapper" class="genre-depression">
            <div class="orb"><div class="internal-smoke"></div></div>
            <div id="face-mover">
                <div class="eyes-row">
                    <div class="eye sleep" id="eye-l"></div>
                    <div class="eye sleep" id="eye-r"></div>
                </div>
                <div id="mouth" class="mouth"></div>
            </div>
        </div>
        <div class="hands-container">
            <div class="hand" id="hand-l"></div>
            <div class="hand" id="hand-r"><div id="baton"><div class="baton-glow"></div></div></div>
        </div>
    </div>

    <script>
        const bodyWrapper = document.getElementById('body-wrapper');
        const shadow = document.getElementById('shadow');
        const face = document.getElementById('face-mover');
        const eyeL = document.getElementById('eye-l');
        const eyeR = document.getElementById('eye-r');
        const handL = document.getElementById('hand-l');
        const handR = document.getElementById('hand-r');
        const baton = document.getElementById('baton');

        const physics = {
            bodyY:   { current: 0,   target: 14,  vel: 0, spring: 0.05, friction: 0.80 },
            scaleX:  { current: 1,   target: 1,   vel: 0, spring: 0.06, friction: 0.80 },
            scaleY:  { current: 1,   target: 1,   vel: 0, spring: 0.06, friction: 0.80 },
            rotate:  { current: 0,   target: 0,   vel: 0, spring: 0.04, friction: 0.82 },
            faceX:   { current: 0,   target: 0,   vel: 0, spring: 0.05, friction: 0.82 },
            faceY:   { current: 0,   target: 12,  vel: 0, spring: 0.05, friction: 0.82 },
            handLX:  { current: -24, target: -24, vel: 0, spring: 0.05, friction: 0.80 },
            handLY:  { current: 22,  target: 22,  vel: 0, spring: 0.05, friction: 0.80 },
            handRX:  { current: 24,  target: 24,  vel: 0, spring: 0.05, friction: 0.80 },
            handRY:  { current: 20,  target: 20,  vel: 0, spring: 0.05, friction: 0.80 },
            batonRot:{ current: -35, target: -35, vel: 0, spring: 0.06, friction: 0.78 }
        };

        let appState = 'SLEEP';
        let globalTime = Math.random() * 1000;
        let lastFrameTime = performance.now();

        window.onload = () => { loop(); };

        window.setPlaybackState = function(isPlaying) {
            if (isPlaying && appState === 'SLEEP') transitionToWake();
            else if (!isPlaying && appState !== 'SLEEP') triggerSleep();
        };

        window.setGenre = function(genre) {};

        function triggerSleep() {
            appState = 'SLEEP';
            baton.style.opacity = 0;
            handL.classList.remove('visible');
            handR.classList.remove('visible');
            physics.bodyY.target = 16;
            physics.faceY.target = 14;
            physics.faceX.target = 0;
            physics.scaleX.target = 1.05;
            physics.scaleY.target = 0.95;
            physics.rotate.target = 0;
            physics.handLX.target = -20;
            physics.handLY.target = 30;
            physics.handRX.target = 20;
            physics.handRY.target = 30;
            physics.batonRot.target = -65;
        }

        function transitionToWake() {
            appState = 'CONDUCT';
            eyeL.classList.remove('sleep');
            eyeR.classList.remove('sleep');
            handL.classList.add('visible');
            handR.classList.add('visible');
            baton.style.opacity = 0.9;
        }

        let blinkTimer = 3.0 + Math.random() * 4.0;
        let isBlinking = false;
        function triggerBlink() {
            if (!isBlinking && appState === 'CONDUCT') {
                isBlinking = true;
                eyeL.classList.add('blink'); eyeR.classList.add('blink');
                setTimeout(() => { eyeL.classList.remove('blink'); eyeR.classList.remove('blink'); isBlinking = false; }, 140);
            }
        }

        // ══════════════════════════════════════════════════════════════
        // DEPRESSED ARC CONDUCTING SEQUENCES (Slow, Heavy & Visibly Wide)
        // ══════════════════════════════════════════════════════════════
        const sequences = [
            // 0: Heavy Melancholic Slow Sway (Wide & Slow)
            { dur: 7.5, update(t) {
                let sway = Math.sin(t * Math.PI * 0.5); // Slow 4-second sway cycle
                let bounce = Math.sin(t * Math.PI * 0.8);
                physics.rotate.target = sway * 15; // Visible 15° body sway
                physics.bodyY.target = 14 + bounce * 9; // Heavy 14px to 23px slump
                physics.scaleX.target = 1 + bounce * 0.06;
                physics.scaleY.target = 1 - bounce * 0.06;
                physics.faceX.target = sway * 8;
                physics.faceY.target = 12 + bounce * 5;
                physics.handRX.target = 24 + sway * 18;
                physics.handRY.target = 20 + bounce * 10;
                physics.handLX.target = -24 + sway * 12;
                physics.handLY.target = 22 - bounce * 8;
                physics.batonRot.target = sway * 40 - 25; // Wide slow baton arc (-65° to +15°)
                face.className = 'face-state-depressed-slump';
            }},

            // 1: Slow Head Shake of Sorrow (Slow Grief)
            { dur: 7.0, update(t) {
                let shake = Math.sin(t * Math.PI * 0.9); // Slow, heavy head shake
                let pulse = Math.sin(t * Math.PI * 0.45);
                physics.faceX.target = shake * 10; // 10px slow heavy head shake
                physics.faceY.target = 13 + pulse * 4;
                physics.bodyY.target = 18 + pulse * 6;
                physics.rotate.target = shake * 8;
                physics.scaleX.target = 1.04;
                physics.scaleY.target = 0.96;
                physics.handLX.target = -26 + shake * 5;
                physics.handLY.target = 18 + pulse * 10;
                physics.handRX.target = 26 + shake * 5;
                physics.handRY.target = 18 + pulse * 10;
                physics.batonRot.target = -45 + shake * 20;
                face.className = 'face-state-depressed-shake';
            }},

            // 2: Hands to Face / Heavy Rocking Despair
            { dur: 7.5, update(t) {
                let rock = Math.sin(t * Math.PI * 0.6); // Slow 3.3s rocking motion
                physics.handLX.target = -14 + rock * 4;
                physics.handRX.target = 14 - rock * 4;
                physics.handLY.target = -8 + rock * 7; // Raised near face level
                physics.handRY.target = -8 - rock * 7;
                physics.bodyY.target = 14 + rock * 10;
                physics.rotate.target = rock * 12;
                physics.scaleX.target = 1.08 - rock * 0.08;
                physics.scaleY.target = 0.92 + rock * 0.08;
                physics.faceX.target = rock * 5;
                physics.faceY.target = 12 + Math.abs(rock) * 5;
                physics.batonRot.target = -30 + rock * 25;
                face.className = 'face-state-depressed-clutch';
            }},

            // 3: Deep Slump & Heavy Sigh Heave (Slow & Somber Rebound)
            { dur: 7.0, update(t) {
                let heave = Math.sin(t * Math.PI * 0.5); // Slow heave cycle
                let isUp = heave < 0;
                physics.bodyY.target = isUp ? -2 : 24; // Slow heavy heave
                physics.scaleY.target = isUp ? 1.15 : 0.82;
                physics.scaleX.target = isUp ? 0.85 : 1.18;
                physics.rotate.target = heave * 12;
                physics.faceY.target = isUp ? -8 : 18;
                physics.faceX.target = heave * 6;
                physics.handRX.target = isUp ? 34 : 18;
                physics.handRY.target = isUp ? -14 : 26;
                physics.handLX.target = isUp ? -34 : -18;
                physics.handLY.target = isUp ? -14 : 26;
                physics.batonRot.target = isUp ? 20 : -75;
                face.className = isUp ? 'face-state-depressed-outburst' : 'face-state-depressed-slump';
            }},

            // 4: Slow Tragic Conductor Slash
            { dur: 8.0, update(t) {
                let slash = Math.sin(t * Math.PI * 0.5); // Slow 4-second tragic conducting arc
                physics.bodyY.target = 12 + Math.abs(slash) * 10;
                physics.rotate.target = slash * 14;
                physics.scaleX.target = 1 + slash * 0.08;
                physics.scaleY.target = 1 - slash * 0.08;
                physics.faceX.target = slash * 8;
                physics.faceY.target = 10 + Math.abs(slash) * 6;
                physics.handRX.target = 28 + slash * 18;
                physics.handRY.target = 14 + slash * 14;
                physics.handLX.target = -28 + slash * 14;
                physics.handLY.target = 20 - slash * 10;
                physics.batonRot.target = slash * 45 - 20;
                face.className = 'face-state-depressed-shake';
            }}
        ];

        let seqIndex = 0;
        let seqTime = 0;
        let seqDuration = sequences[0].dur;

        function updateConduct(dt, tempo) {
            blinkTimer -= dt;
            if (blinkTimer <= 0) {
                triggerBlink();
                blinkTimer = 3.0 + Math.random() * 4.0;
            }
            seqTime += dt * 0.55; // Slow, heavy melancholic pace!
            if (seqTime >= seqDuration) {
                seqIndex = (seqIndex + 1) % sequences.length;
                seqTime = 0;
                seqDuration = sequences[seqIndex].dur;
            }
            sequences[seqIndex].update(seqTime);
        }

        function applyPhysics() {
            for (let key in physics) {
                let p = physics[key];
                let force = (p.target - p.current) * p.spring;
                p.vel += force;
                p.vel *= p.friction;
                p.current += p.vel;
            }
            bodyWrapper.style.transform = `translateY(${physics.bodyY.current}px) scale(${physics.scaleX.current}, ${physics.scaleY.current}) rotate(${physics.rotate.current}deg)`;
            shadow.style.transform = `scale(${physics.scaleX.current - (physics.bodyY.current * 0.010)})`;
            shadow.style.opacity = 0.40 - (physics.bodyY.current * 0.006);
            face.style.transform = `translate(calc(-50% + ${physics.faceX.current}px), calc(-50% + ${physics.faceY.current}px))`;
            handL.style.transform = `translate(calc(-50% + 50vw + ${physics.handLX.current}px), calc(-50% + 50vh + ${physics.handLY.current}px))`;
            handR.style.transform = `translate(calc(-50% + 50vw + ${physics.handRX.current}px), calc(-50% + 50vh + ${physics.handRY.current}px))`;
            baton.style.transform = `rotate(${physics.batonRot.current}deg)`;
        }

        function loop() {
            let now = performance.now();
            let dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;
            globalTime += dt * 0.55;

            if (appState === 'CONDUCT') {
                updateConduct(dt, 0.55);
            } else {
                let breath = Math.sin(globalTime * 1.5);
                physics.scaleX.target = 1.04 + breath * 0.02;
                physics.scaleY.target = 0.96 - breath * 0.02;
                physics.faceY.target = 14;
                physics.bodyY.target = 16;
            }
            applyPhysics();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
