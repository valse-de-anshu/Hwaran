<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Autumn Harvest Jellyball</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none !important;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      background: transparent !important;
      pointer-events: none !important;
    }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="webgl-container"></div>

  <script>
    const container = document.getElementById('webgl-container');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 0.05, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    // Root creature anchor group
    const creature = new THREE.Group();
    scene.add(creature);

    const BALL_RADIUS = 0.95;
    const bodyGeometry = new THREE.SphereGeometry(BALL_RADIUS, 64, 64);

    const autumnHarvestMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0.0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vLocalPos;

        void main() {
          vLocalPos = position;
          vNormal = normalize(normalMatrix * normal);
          vec4 worldPos = modelViewMatrix * vec4(position, 1.0);
          vViewDir = normalize(-worldPos.xyz);
          gl_Position = projectionMatrix * worldPos;
        }
      `,
      fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        varying vec3 vLocalPos;
        uniform float uTime;

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(vViewDir);

          // Warm golden hour sunlight from high-left
          vec3 sunDir = normalize(vec3(-0.35, 0.72, 0.65));
          float NdotL = dot(N, sunDir);
          float halfLambert = NdotL * 0.5 + 0.5;

          // Autumn Harvest Palette:
          // Warm Roasted Chestnut/Caramel shadow -> Honeyed Butterscotch -> Sweet Golden Harvest Cream
          vec3 roastedChestnut = vec3(0.68, 0.28, 0.14); // Cozy rich autumn shadow
          vec3 honeyPumpkin   = vec3(0.96, 0.60, 0.32); // Warm sunlit harvest midtone
          vec3 goldenCream    = vec3(1.00, 0.93, 0.82); // Soft afternoon highlight
          vec3 harvestSheen   = vec3(1.00, 0.88, 0.60); // Warm amber specular sheen
          vec3 fieryMapleRim  = vec3(1.00, 0.62, 0.25); // Radiant twilight fresnel rim

          // Smooth gradient lighting
          vec3 col = mix(roastedChestnut, honeyPumpkin, smoothstep(0.08, 0.50, halfLambert));
          col = mix(col, goldenCream, smoothstep(0.50, 0.92, halfLambert));

          // Silky golden specular sheen
          vec3 H = normalize(sunDir + V);
          float spec = pow(max(0.0, dot(N, H)), 14.0) * 0.34;
          col += harvestSheen * spec;

          // Warm golden forest ground bounce
          float bounce = max(0.0, -N.y) * 0.25;
          col += vec3(0.95, 0.45, 0.15) * bounce;

          // Amber autumn twilight fresnel rim
          float fresnel = pow(1.0 - max(0.0, dot(N, V)), 2.8);
          col = mix(col, fieryMapleRim, fresnel * 0.48);

          // Cozy cinnamon-rose cheek blush (Zero polygon clipping seams)
          if (vLocalPos.z > 0.40 && vLocalPos.y < 0.15) {
            float leftCheek  = distance(vLocalPos, vec3(-0.42, -0.10, 0.82));
            float rightCheek = distance(vLocalPos, vec3( 0.42, -0.10, 0.82));
            float blushMask = smoothstep(0.25, 0.0, leftCheek) + smoothstep(0.25, 0.0, rightCheek);
            vec3 autumnBlush = vec3(0.98, 0.36, 0.32);
            col = mix(col, autumnBlush, clamp(blushMask * 0.56, 0.0, 1.0));
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const bodyMesh = new THREE.Mesh(bodyGeometry, autumnHarvestMaterial);
    creature.add(bodyMesh);

    const autumnOrnamentGroup = new THREE.Group();

    // Fiery Japanese Red Maple Material
    const mapleRedMat = new THREE.MeshStandardMaterial({
      color: 0xd62828,
      emissive: 0x48040a,
      emissiveIntensity: 0.30,
      roughness: 0.28,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    // Golden Ginkgo Leaf Material
    const goldenGinkgoMat = new THREE.MeshStandardMaterial({
      color: 0xfcb001,
      emissive: 0x422800,
      emissiveIntensity: 0.26,
      roughness: 0.25,
      metalness: 0.08,
      side: THREE.DoubleSide
    });

    // Polished Warm Acorn Nut Body Material
    const acornNutMat = new THREE.MeshStandardMaterial({
      color: 0xa45a2a,
      roughness: 0.20,
      metalness: 0.10
    });

    // Textured Woody Acorn Cap Material
    const acornCapMat = new THREE.MeshStandardMaterial({
      color: 0x5a341a,
      roughness: 0.55,
      metalness: 0.04
    });

    // Little Woodland Stem Material
    const woodlandStemMat = new THREE.MeshStandardMaterial({
      color: 0x3d2314,
      roughness: 0.50,
      metalness: 0.02
    });

    function createMapleLeaf() {
      const leafGroup = new THREE.Group();

      const leafShape = new THREE.Shape();
      leafShape.moveTo(0, 0);

      // Left bottom lobe
      leafShape.quadraticCurveTo(-0.06, 0.08, -0.16, 0.08);
      leafShape.lineTo(-0.11, 0.13);

      // Left middle lobe
      leafShape.quadraticCurveTo(-0.18, 0.22, -0.25, 0.28);
      leafShape.lineTo(-0.16, 0.28);

      // Left upper lobe
      leafShape.quadraticCurveTo(-0.18, 0.38, -0.16, 0.46);
      leafShape.lineTo(-0.08, 0.40);

      // Center main peak lobe
      leafShape.quadraticCurveTo(-0.03, 0.52, 0.0, 0.60);
      leafShape.quadraticCurveTo(0.03, 0.52, 0.08, 0.40);

      // Right upper lobe
      leafShape.lineTo(0.16, 0.46);
      leafShape.quadraticCurveTo(0.18, 0.38, 0.16, 0.28);

      // Right middle lobe
      leafShape.lineTo(0.25, 0.28);
      leafShape.quadraticCurveTo(0.18, 0.22, 0.11, 0.13);

      // Right bottom lobe
      leafShape.lineTo(0.16, 0.08);
      leafShape.quadraticCurveTo(0.06, 0.08, 0.0, 0.0);

      const leafGeom = new THREE.ExtrudeGeometry(leafShape, {
        depth: 0.016,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.008,
        bevelThickness: 0.008
      });
      leafGeom.center();

      const leafMesh = new THREE.Mesh(leafGeom, mapleRedMat);
      leafGroup.add(leafMesh);

      // Little leaf stem
      const stemGeom = new THREE.CylinderGeometry(0.010, 0.010, 0.16, 8);
      const stemMesh = new THREE.Mesh(stemGeom, woodlandStemMat);
      stemMesh.position.set(0, -0.32, 0);
      stemMesh.rotation.z = 0.10;
      leafGroup.add(stemMesh);

      return leafGroup;
    }

    const mapleLeaf = createMapleLeaf();
    mapleLeaf.scale.set(0.85, 0.85, 0.85);
    mapleLeaf.position.set(0.06, 0.12, 0.02);
    mapleLeaf.rotation.set(-0.18, 0.20, -0.35);
    autumnOrnamentGroup.add(mapleLeaf);

    function createGinkgoLeaf() {
      const ginkgoShape = new THREE.Shape();
      ginkgoShape.moveTo(0, 0);
      ginkgoShape.quadraticCurveTo(-0.06, 0.12, -0.18, 0.24);
      ginkgoShape.quadraticCurveTo(-0.10, 0.35, -0.02, 0.32);
      // Delicate center notch of ginkgo leaf
      ginkgoShape.lineTo(0.0, 0.25);
      ginkgoShape.lineTo(0.02, 0.32);
      ginkgoShape.quadraticCurveTo(0.10, 0.35, 0.18, 0.24);
      ginkgoShape.quadraticCurveTo(0.06, 0.12, 0.0, 0.0);

      const ginkgoGeom = new THREE.ExtrudeGeometry(ginkgoShape, {
        depth: 0.012,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.006,
        bevelThickness: 0.006
      });
      ginkgoGeom.center();

      const ginkgoMesh = new THREE.Mesh(ginkgoGeom, goldenGinkgoMat);
      return ginkgoMesh;
    }

    const ginkgoLeaf = createGinkgoLeaf();
    ginkgoLeaf.scale.set(0.75, 0.75, 0.75);
    ginkgoLeaf.position.set(0.24, 0.26, -0.04);
    ginkgoLeaf.rotation.set(-0.30, 0.36, -0.85);
    autumnOrnamentGroup.add(ginkgoLeaf);

    function createWoodlandAcorn() {
      const acornGroup = new THREE.Group();

      // Plump glossy acorn nut
      const nutGeom = new THREE.SphereGeometry(0.088, 22, 22);
      nutGeom.scale(1.0, 1.35, 1.0);
      const nutMesh = new THREE.Mesh(nutGeom, acornNutMat);
      nutMesh.position.y = -0.04;
      acornGroup.add(nutMesh);

      // Cute acorn pointy bottom tip
      const tipGeom = new THREE.ConeGeometry(0.016, 0.032, 10);
      tipGeom.scale(1.0, -1.0, 1.0);
      const tipMesh = new THREE.Mesh(tipGeom, acornNutMat);
      tipMesh.position.y = -0.165;
      acornGroup.add(tipMesh);

      // Textured cap of the acorn
      const capGeom = new THREE.SphereGeometry(0.098, 22, 14, 0, Math.PI * 2, 0, Math.PI * 0.52);
      const capMesh = new THREE.Mesh(capGeom, acornCapMat);
      capMesh.position.y = 0.015;
      acornGroup.add(capMesh);

      // Little curled oak stem on cap
      const capStemGeom = new THREE.CylinderGeometry(0.012, 0.010, 0.065, 8);
      capStemGeom.translate(0, 0.032, 0);
      const capStem = new THREE.Mesh(capStemGeom, woodlandStemMat);
      capStem.position.set(0, 0.085, 0);
      capStem.rotation.z = 0.25;
      acornGroup.add(capStem);

      return acornGroup;
    }

    const acorn = createWoodlandAcorn();
    acorn.scale.set(0.92, 0.92, 0.92);
    acorn.position.set(-0.16, -0.02, 0.12);
    acorn.rotation.set(-0.25, -0.30, 0.32);
    autumnOrnamentGroup.add(acorn);

    // Perch autumn ornament cluster atop the jellyball
    autumnOrnamentGroup.position.set(0.36, 0.78, 0.28);
    autumnOrnamentGroup.rotation.set(-0.14, 0.18, -0.16);
    creature.add(autumnOrnamentGroup);

    const faceGroup = new THREE.Group();
    creature.add(faceGroup);

    function createMinimalistPillEyeGeometry() {
      const w = 0.065;
      const h = 0.175;
      const r = w;
      const shape = new THREE.Shape();
      shape.moveTo(-w, -h + r);
      shape.lineTo(-w, h - r);
      shape.absarc(0, h - r, r, Math.PI, 0, true);
      shape.lineTo(w, -h + r);
      shape.absarc(0, -h + r, r, 0, Math.PI, true);

      return new THREE.ExtrudeGeometry(shape, {
        depth: 0.045,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.016,
        bevelThickness: 0.016
      });
    }

    const eyeGeometry = createMinimalistPillEyeGeometry();
    eyeGeometry.center();

    // Sleek, deep glossy obsidian mascot eye material
    const eyeMaterial = new THREE.MeshStandardMaterial({
      color: 0x111116,
      roughness: 0.15,
      metalness: 0.12
    });

    // Left eye
    const leftEyeMesh = new THREE.Mesh(eyeGeometry, eyeMaterial);
    leftEyeMesh.position.set(-0.25, 0.04, 0.91);
    leftEyeMesh.rotation.set(-0.06, -0.26, 0.05);
    faceGroup.add(leftEyeMesh);

    // Right eye
    const rightEyeMesh = new THREE.Mesh(eyeGeometry, eyeMaterial);
    rightEyeMesh.position.set(0.25, 0.04, 0.91);
    rightEyeMesh.rotation.set(-0.06, 0.26, -0.05);
    faceGroup.add(rightEyeMesh);

    const autumnSunLight = new THREE.DirectionalLight(0xffeedd, 1.45);
    autumnSunLight.position.set(-0.7, 1.0, 1.6);
    scene.add(autumnSunLight);

    const warmAmbientLight = new THREE.AmbientLight(0xffe2cc, 0.65);
    scene.add(warmAmbientLight);

    // Warm cozy maple glow bounce light
    const mapleBounceLight = new THREE.PointLight(0xff5522, 0.95, 2.2);
    mapleBounceLight.position.set(0.40, 0.95, 0.38);
    creature.add(mapleBounceLight);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    });

    let isHappy = false;
    window.setHappy = function(val) {
      isHappy = !!val;
    };

    const blink = { active: false, progress: 0, nextTime: 2.2, isWink: false };
    const glance = { targetX: 0, targetY: 0, currentX: 0, currentY: 0, nextTime: 2.0 };
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Look-around glance engine: curious glances left, right, and up at its acorn
      if (time > glance.nextTime) {
        const r = Math.random();
        if (r < 0.35) {
          // Look up at acorn on head with wonder
          glance.targetX = (Math.random() - 0.5) * 0.12;
          glance.targetY = 0.16;
        } else if (r < 0.70) {
          // Inquisitive side glance
          glance.targetX = (Math.random() > 0.5 ? 0.18 : -0.18);
          glance.targetY = -0.04;
        } else {
          // Look straight at user
          glance.targetX = 0;
          glance.targetY = 0;
        }
        glance.nextTime = time + 1.8 + Math.random() * 2.6;
      }
      glance.currentX += (glance.targetX - glance.currentX) * 0.08;
      glance.currentY += (glance.targetY - glance.currentY) * 0.08;

      if (isHappy) {
        // Delighted celebration: fast excited bouncy jiggle & acorn joy dance
        const bouncePhase = Math.sin(time * 7.0);
        const scaleY = 1.0 + Math.abs(bouncePhase) * 0.14;
        const scaleX = 1.0 - Math.abs(bouncePhase) * 0.10;
        const scaleZ = 1.0 / Math.sqrt(scaleX * scaleY);
        creature.scale.set(scaleX, scaleY, scaleZ);

        creature.position.y = Math.abs(bouncePhase) * 0.15;
        creature.position.x = Math.sin(time * 3.5) * 0.05;
        creature.rotation.z = Math.sin(time * 4.0) * 0.14;
        creature.rotation.y = glance.currentX * 0.3;

        autumnOrnamentGroup.rotation.z = -0.16 + Math.sin(time * 10.0) * 0.22;
        acorn.rotation.z = 0.32 + Math.cos(time * 12.0) * 0.30;
      } else {
        // Cozy hearty rolling wobble
        const rollPhase = Math.sin(time * 2.2);
        const hopPhase = Math.abs(Math.sin(time * 2.2));

        const scaleY = 1.0 + (hopPhase - 0.5) * 0.08;
        const scaleX = 1.0 - (hopPhase - 0.5) * 0.06 + Math.abs(rollPhase) * 0.03;
        const scaleZ = 1.0 / Math.sqrt(scaleX * scaleY);
        creature.scale.set(scaleX, scaleY, scaleZ);

        creature.position.y = hopPhase * 0.07 - 0.035;
        creature.position.x = rollPhase * 0.04;
        creature.rotation.z = rollPhase * 0.10;
        creature.rotation.y = Math.sin(time * 1.1) * 0.08 + glance.currentX * 0.2;

        autumnOrnamentGroup.rotation.z = -0.16 - (creature.rotation.z * 1.6) + Math.sin(time * 4.0) * 0.08;
        autumnOrnamentGroup.rotation.x = -0.14 + Math.cos(time * 2.8) * 0.07;
        acorn.rotation.z = 0.32 + Math.sin(time * 4.4) * 0.14;
      }

      // Parallax eye tracking & head tilt
      faceGroup.position.x = glance.currentX;
      faceGroup.position.y = glance.currentY;
      faceGroup.rotation.y = glance.currentX * 0.25;
      faceGroup.rotation.x = -glance.currentY * 0.25;

      // Mascot Blinking & Cozy Winks
      if (!blink.active) {
        if (time > blink.nextTime) {
          blink.active = true;
          blink.progress = 0;
          blink.isWink = Math.random() < 0.28; // 28% chance of sweet cozy wink!
          blink.nextTime = time + 2.2 + Math.random() * 3.2;
        }
      } else {
        blink.progress += delta * 10.0;
        const blinkPhase = Math.sin(blink.progress * Math.PI);
        const eyeScaleY = Math.max(0.05, 1.0 - blinkPhase * 0.95);

        if (blink.isWink) {
          // Playful wink on right eye, cozy half-squint on left eye
          rightEyeMesh.scale.set(1.0, eyeScaleY, 1.0);
          leftEyeMesh.scale.set(1.0, Math.max(0.5, 1.0 - blinkPhase * 0.5), 1.0);
        } else {
          leftEyeMesh.scale.set(1.0, eyeScaleY, 1.0);
          rightEyeMesh.scale.set(1.0, eyeScaleY, 1.0);
        }

        if (blink.progress >= 1.0) {
          blink.active = false;
          leftEyeMesh.scale.set(1.0, 1.0, 1.0);
          rightEyeMesh.scale.set(1.0, 1.0, 1.0);
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
